name: intraday
# Roz ka intraday data jama karo (Nifty/Sensex/BankNifty 1-min + 5-min). Writes data/intraday/*.csv.gz
# Run manually: Actions > intraday > Run workflow.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 10 * * 1-5"   # 16:00 IST (market band hone ke baad)
permissions:
  contents: write
jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Intraday data
        run: python collect_intraday.py
      - name: Commit result
        run: |
          git config user.name "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add data/intraday
          git diff --cached --quiet && exit 0
          git commit -m "intraday $(date -u +%F-%H%M)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && exit 0
            sleep 5
          done
          exit 1
